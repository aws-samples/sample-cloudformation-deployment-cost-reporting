[project]
name = "cfn-cost-delta-plugin"
version = "0.1.0"
description = "Reports the cost of resources added, removed, and resized by CloudFormation deployments"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "cfn-lint==1.55.0",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Selected explicitly rather than relying on ruff's defaults, which shift between
# releases and would make lint results depend on the installed version.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "N"]
ignore = [
    # Arguments named to mirror the boto3 API (Item, Key, StackName).
    "N803",
    # Asserts are the point of a test suite.
    "S101",
    # `str, Enum` is used consistently across all ten enums in the codebase and
    # every call site reads `.value` explicitly. Switching to StrEnum would
    # change `str()` behaviour for no benefit here.
    "UP042",
    # A ternary is not clearer than the if/else blocks it would replace.
    "SIM108",
    # `raise NotActionable(...)` and `except NotActionable:` read better than the
    # conventional Error suffix for what is a control-flow signal, not a fault.
    "N818",
    # The multiplication sign appears in report labels shown to users
    # ("cache.t4g.micro x 3 node hours"), where it is deliberate.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# conftest manipulates sys.path before importing the packages under test.
"tests/conftest.py" = ["E402"]
# Test fixtures contain long literal lines and dummy tokens.
"tests/*" = ["E501", "S105", "S106", "S107", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src"]
